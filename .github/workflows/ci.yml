name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: PHP ${{ matrix.php }} - Symfony ${{ matrix.symfony }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        symfony: ['7.4.*', '8.*']
    env:
      # Flex caps every symfony/* package, transitive ones included, so the whole stack matches the line under test.
      SYMFONY_REQUIRE: ${{ matrix.symfony }}
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: flex

      - name: Validate composer.json
        run: composer validate --strict

      - uses: ramsey/composer-install@v4

      - name: PHP-CS-Fixer
        run: composer cs

      - name: PHPStan
        run: composer phpstan

      - name: PHPUnit
        run: composer test

  example:
    name: Example application through the Emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: zip

      - uses: ramsey/composer-install@v4
        with:
          working-directory: example

      - name: Package
        working-directory: example
        run: vendor/bin/scaleway-package

      # Serves the zip as Scaleway would run it: extracted elsewhere, read-only, in prod.
      - name: Serve the packaged function
        run: |
          unzip -q example/function.zip -d "$RUNNER_TEMP/function"
          chmod -R a-w "$RUNNER_TEMP/function"
          APP_ENV=prod APP_SECRET=ci php "$RUNNER_TEMP/function/vendor/bin/scaleway-serve" 127.0.0.1:8000 > "$RUNNER_TEMP/serve.log" 2>&1 &
          timeout 10 bash -c 'until curl -sf http://127.0.0.1:8000/hello > /dev/null; do sleep 0.2; done'

      - name: End-to-end scenarios
        run: example/e2e/run.sh http://127.0.0.1:8000

      - name: Emulator log
        if: always()
        run: cat "$RUNNER_TEMP/serve.log"
