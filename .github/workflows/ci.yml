name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: PHP ${{ matrix.php }} - Symfony ${{ matrix.symfony }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        symfony: ['7.4.*', '8.*']
    env:
      # Flex caps every symfony/* package, transitive ones included, so the whole stack matches the line under test.
      SYMFONY_REQUIRE: ${{ matrix.symfony }}
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          # Covers the zstd and brotli compression of Static Files, skipped without them.
          extensions: zstd, brotli
          tools: flex

      - name: Validate composer.json
        run: composer validate --strict

      - uses: ramsey/composer-install@v4

      - name: PHP-CS-Fixer
        run: composer cs

      - name: PHPStan
        run: composer phpstan

      - name: PHPUnit
        run: composer test

  example:
    name: Example application through the Emulator
    runs-on: ubuntu-latest
    env:
      SCALEWAY_CRON_SECRET: ci-cron-secret
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: zip, zstd

      - name: Install with the runtime of this checkout
        working-directory: example
        run: composer link-runtime

      - name: Serve in dev
        run: |
          (cd example && vendor/bin/scaleway-serve 127.0.0.1:8000 > "$RUNNER_TEMP/serve.log" 2>&1 &)
          timeout 10 bash -c 'until curl -sf http://127.0.0.1:8000/hello > /dev/null; do sleep 0.2; done'

      - name: End-to-end scenarios in dev
        run: example/e2e/run.sh http://127.0.0.1:8000

      # Packages the example, installs the zip like Scaleway at deploy time and serves it in prod.
      - name: Deploy locally
        run: |
          APP_SECRET=ci example/e2e/deploy-locally.sh 127.0.0.1:8001 > "$RUNNER_TEMP/deploy.log" 2>&1 &
          timeout 300 bash -c 'until curl -sf http://127.0.0.1:8001/hello > /dev/null; do sleep 1; done'

      - name: End-to-end scenarios on the deployed zip
        run: example/e2e/run.sh http://127.0.0.1:8001

      - name: Emulator logs
        if: always()
        run: cat "$RUNNER_TEMP/serve.log" "$RUNNER_TEMP/deploy.log"
